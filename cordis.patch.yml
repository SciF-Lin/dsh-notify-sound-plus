# ============================================================================
# dsh-notify-sound-plus —— DSH bundle patch（挂载声明）
# ============================================================================
# DSH 启动时按 bundle 层栈叠加各插件 patch，本文件把插件插入 profile 配置树。
#
# 安装（推荐，由 dsh 自己写 package.json 与 bundle 列表）：
#   dsh plugin --profile desktop add link:E:\download\app\news\dsh-notify-sound
#   dsh plugin --profile web     add link:E:\download\app\news\dsh-notify-sound
#
# 安装后需重启 DSH：宿主路由与客户端 boot graph 都在启动时注册。
# ============================================================================

