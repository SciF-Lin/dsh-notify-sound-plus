# ⚠️ YAML 注意：description 里含 ": " 会被解析成嵌套键，所以这里用单引号包住。

url: https://github.com/SciF-Lin/dsh-notify-sound-plus
name: SciF-Lin/dsh-notify-sound-plus
category: notify
description:
  en: 'Per-event alerts for DeepSeek Harness. Four events — turn-complete, question, approval and error — each get their own sound and their own optional system notification. A row in General settings holds the mode dropdown (on, off, or smart to defer to the whale widget so the two never overlap), a preview button and a gear that opens the full settings dialog: per-event switches, sound pickers with instant preview, volume, a skip-while-focused option, system-notification toggles with permission handling, and upload of your own audio. A speaker button in the composer mutes sound temporarily without touching notifications. Every built-in tone is synthesized at runtime with the Web Audio API, so the package ships no audio files. Works on both the web GUI and the Electron desktop app.'
  zh: 'DSH 逐事件提醒插件：任务完成 / 需要你回答 / 需要你授权 / 出错四类事件，各配自己的提示音，也可各自弹出系统通知。在「设置 → 通用」的那一行里有模式下拉框（开启 / 关闭 / 智能判断，智能模式会让开鲸鱼余额挂件的事件避免重复提示）、播放按钮和齿轮；齿轮打开完整设置弹窗，可在里面逐事件开关、选音并即时试听、调音量、设置「应用在前台运行时不提示」、开关系统通知（含权限申请），以及上传自己的音频。对话输入框左下角的小喇叭可临时静音声音而不影响系统通知。内置音色全部实时合成，不随包分发音频文件。网页端与桌面端（Electron）均可用。'
